name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # Needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags, for the version embedded in the firmware

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run -e adafruit_matrixportal_esp32s3

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/adafruit_matrixportal_esp32s3/firmware.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/adafruit_matrixportal_esp32s3/firmware.bin
          generate_release_notes: true
