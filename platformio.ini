; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adafruit_matrixportal_esp32s3

[env:adafruit_matrixportal_esp32s3]
platform = espressif32@6.12.0
board = adafruit_matrixportal_esp32s3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
lib_deps =
    adafruit/Adafruit Protomatter@1.7.1
    adafruit/Adafruit GFX Library@1.12.3
    adafruit/Adafruit LIS3DH@1.3.0
    bblanchon/ArduinoJson@7.4.2

; Wireless upload: LYNX_OTA_PASSWORD=<admin_password> pio run -e ota -t upload
[env:ota]
extends = env:adafruit_matrixportal_esp32s3
upload_protocol = espota
upload_port = lynx.local
upload_flags = --auth=${sysenv.LYNX_OTA_PASSWORD}

; Unit tests of the hardware-independent logic (src/core) on the computer: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
